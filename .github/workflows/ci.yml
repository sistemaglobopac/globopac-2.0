name: CI

on:
  pull_request:
  push:
    branches: [main]

# Débito técnico da v1 a não repetir: "Deploy de Edge Function manual via dashboard porque a
# CLI 'crasha'". A causa raiz mais comum desse tipo de sintoma é usar uma versão não pinada
# da CLI/imagens Docker do stack local. Aqui a versão da Supabase CLI vem do package.json
# (pinada), e o job roda em um runner com Docker disponível nativamente.

jobs:
  segredos-e-dependencias:
    name: Scanner de segredos vazados
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  migrations-e-rls:
    name: Migrations aplicam do zero + testes de RLS (pgTAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências
        run: npm install

      - name: Instalar Supabase CLI (versão pinada)
        uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Subir stack local do Supabase
        run: supabase start

      - name: Aplicar migrations do zero (supabase db reset)
        run: supabase db reset

      - name: Rodar testes de banco (pgTAP) — RLS por perfil, segregação de funções, append-only
        run: supabase test db

      - name: Parar stack
        if: always()
        run: supabase stop

  frontend:
    name: Lint + typecheck + testes unit/componente + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Testes unitários e de componente (Vitest)
        run: npm run test:unit

      - name: Build (placeholder de env — build real precisa de VITE_SUPABASE_* válidos, ver job e2e)
        run: npm run build
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_ANON_KEY: placeholder-somente-para-o-build-tipar-o-cliente

  e2e:
    name: E2E (Playwright) — fluxos críticos ponta a ponta
    runs-on: ubuntu-latest
    needs: [migrations-e-rls, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm install

      - name: Instalar Supabase CLI (versão pinada)
        uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Subir stack local do Supabase (Postgres + Auth + Edge Functions)
        run: supabase start

      - name: Aplicar migrations + seed (usuários e template de teste)
        run: supabase db reset

      - name: Escrever .env.local com URL/chaves do stack local (Vite carrega automaticamente)
        # Grava direto em .env.local em vez de passar por $GITHUB_ENV: evita qualquer
        # ambiguidade de aspas/quoting ao reexportar um valor lido de outro comando — Vite lê
        # .env.local nativamente no build, sem nenhuma variável de ambiente extra necessária.
        run: |
          supabase status -o env | grep -E '^(API_URL|ANON_KEY)=' | sed \
            -e 's/^API_URL=/VITE_SUPABASE_URL=/' \
            -e 's/^ANON_KEY=/VITE_SUPABASE_ANON_KEY=/' > .env.local
          echo "--- .env.local gerado (chave anon local, não é segredo de produção) ---"
          cat .env.local

      - name: Instalar navegadores do Playwright
        run: npx playwright install --with-deps chromium

      - name: Rodar E2E (build + preview + testes — ver playwright.config.ts)
        run: npm run test:e2e

      - name: Publicar relatório do Playwright em caso de falha (HTML + traces/screenshots)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Parar stack
        if: always()
        run: supabase stop

  # Placeholder da Fase 8+: "deploy de migrations + Edge Functions" automatizado contra um
  # projeto Supabase real — depende de SUPABASE_PROJECT_ID/SUPABASE_ACCESS_TOKEN/
  # SUPABASE_DB_PASSWORD como secrets do repositório (ainda não configurados — ver
  # ASSUMPTIONS.md item 8).
