name: Deploy

# Fase 9 (CI/CD) — só roda depois que o CI da main passa, e só faz algo se os secrets do
# projeto Supabase hospedado existirem (SUPABASE_PROJECT_ID/SUPABASE_ACCESS_TOKEN/
# SUPABASE_DB_PASSWORD). Sem eles (estado atual — ver ASSUMPTIONS.md item 8: nenhum projeto
# hospedado foi criado ainda), o job "verificar-secrets" roda e conclui "nada a fazer", sem
# falhar — este workflow fica dormente até o projeto real existir e os secrets serem
# configurados em Settings > Secrets and variables > Actions do repositório (ver README,
# seção "Deploy").
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  verificar-secrets:
    name: Verificar se os secrets de deploy existem
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    outputs:
      tem-secrets: ${{ steps.checar.outputs.tem_secrets }}
    steps:
      - name: Checar SUPABASE_PROJECT_ID/SUPABASE_ACCESS_TOKEN/SUPABASE_DB_PASSWORD
        id: checar
        env:
          PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -n "$PROJECT_ID" ] && [ -n "$ACCESS_TOKEN" ] && [ -n "$DB_PASSWORD" ]; then
            echo "tem_secrets=true" >> "$GITHUB_OUTPUT"
          else
            echo "tem_secrets=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Secrets de deploy ainda não configurados — este workflow fica dormente. Ver README, seção Deploy."
          fi

  deploy:
    name: Aplicar migrations + publicar Edge Functions
    runs-on: ubuntu-latest
    needs: verificar-secrets
    if: ${{ needs.verificar-secrets.outputs.tem-secrets == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Supabase CLI (versão pinada — mesma do resto do projeto)
        uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Vincular ao projeto Supabase hospedado
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

      # --include-all: aplica qualquer migração local ainda não registrada no histórico remoto,
      # mesmo com timestamp anterior à última já aplicada. Sem isso, `db push` recusa migrações
      # "fora de ordem" — situação real encontrada aqui porque migrações já foram aplicadas
      # direto em produção via MCP do Supabase (fora deste pipeline) em mais de uma ocasião,
      # adiantando o histórico remoto além do que a ordem cronológica dos arquivos locais previa.
      - name: Aplicar migrations pendentes (supabase db push)
        run: supabase db push --include-all
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Publicar todas as Edge Functions
        run: supabase functions deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # Só migrations e Edge Functions são publicadas acima — nada aqui sincroniza [auth] do
      # config.toml (site_url, additional_redirect_urls, auth.hook.custom_access_token, etc.)
      # com o projeto hospedado. Bug real encontrado: o Auth Hook (seção RBAC, ver
      # supabase/migrations/20260916000004_rbac_claims_hook.sql) ficou habilitado só em
      # config.toml, nunca aplicado no projeto hospedado — todo JWT saía sem o claim `perfil`,
      # e toda escrita protegida por RLS falhava com "new row violates row-level security
      # policy" para QUALQUER usuário, mesmo ADMIN_MASTER (ver ASSUMPTIONS.md item 61).
      #
      # Deliberadamente NÃO automatizado como `supabase config push`: config.toml tem
      # site_url/additional_redirect_urls apontando para localhost (valores de dev local) —
      # `supabase config push --yes` sem revisão aplicaria isso ao projeto de produção,
      # quebrando redirecionamento de e-mails de auth para usuários de verdade. Este passo só
      # avisa (não falha o deploy, não escreve nada) — aplicar a correção é manual e revisado:
      # `supabase link --project-ref <ref> && supabase config diff` (ler o que mudaria) e só
      # então `supabase config push`, aceitando/recusando cada propriedade no prompt.
      - name: Checar deriva entre config.toml e o projeto hospedado (ex. Auth Hooks)
        id: config-diff
        run: supabase config diff --exit-code
        continue-on-error: true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Avisar sobre deriva de configuração (não bloqueia o deploy)
        if: steps.config-diff.outcome == 'failure'
        run: |
          echo "::warning::supabase/config.toml difere da configuração do projeto hospedado (Auth Hooks, site_url, etc.) — veja o passo anterior para o diff. Aplique manualmente com 'supabase config push' após revisar cada propriedade (nunca automatizado: site_url/additional_redirect_urls deste arquivo são valores de desenvolvimento local)."
